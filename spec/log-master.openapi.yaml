    LogListResponse:
      properties:
        logs:
          items:
            $ref: '#/components/schemas/MergedLog'
          type: array
          title: Logs
        unreachable_sources:
          items:
            type: string
          type: array
          title: Unreachable Sources
      type: object
      required:
      - logs
      - unreachable_sources
      title: LogListResponse
      description: Response of `GET /api/v1/logs`.
    LogResponse:
      properties:
        log:
          $ref: '#/components/schemas/MergedLog'
        unreachable_sources:
          items:
            type: string
          type: array
          title: Unreachable Sources
      type: object
      required:
      - log
      - unreachable_sources
      title: LogResponse
      description: Response of `GET /api/v1/logs/{id}`.
    MergedLog:
      properties:
        log_id:
          type: string
          title: Log Id
        start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Unix Ns
        end_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Unix Ns
        duration_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ns
        total_bytes:
          type: integer
          title: Total Bytes
          default: 0
        recording:
          type: boolean
          title: Recording
          description: Any part is still recording.
        incomplete:
          type: boolean
          title: Incomplete
          description: Any part is interrupted, or a participant of the active log has no part.
        standalone:
          type: boolean
          title: Standalone
          description: Any part was started standalone.
        gaps:
          type: boolean
          title: Gaps
          description: Any part has more than one segment.
        missing_sources:
          items:
            type: string
          type: array
          title: Missing Sources
          description: Participants of the active log without a part.
        parts:
          items:
            $ref: '#/components/schemas/MergedLogPart'
          type: array
          title: Parts
      type: object
      required:
      - log_id
      - start_unix_ns
      - end_unix_ns
      - duration_ns
      - total_bytes
      - recording
      - incomplete
      - standalone
      - gaps
      - missing_sources
      - parts
      title: MergedLog
      description: A log merged over all sources that have a part of it.
    MergedLogPart:
      properties:
        source:
          type: string
          title: Source
        origin:
          anyOf:
          - type: string
            enum:
            - log-master
            - standalone
          - type: 'null'
          title: Origin
        state:
          type: string
          enum:
          - recording
          - complete
          - interrupted
          title: State
        start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Unix Ns
        end_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Unix Ns
        segments:
          items:
            $ref: '#/components/schemas/Segment'
          type: array
          title: Segments
        files:
          items:
            $ref: '#/components/schemas/FileEntry'
          type: array
          title: Files
        total_bytes:
          type: integer
          title: Total Bytes
          default: 0
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Manifest
          description: Only in `GET /api/v1/logs/{id}`.
      type: object
      required:
      - source
      - origin
      - state
      - start_unix_ns
      - end_unix_ns
      - segments
      - files
      - total_bytes
      - manifest
      title: MergedLogPart
      description: One source's part of a log.
    Participant:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - recording
          - armed
          - not_joined
          - busy
          - stop_pending
          - lost
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why the source has not joined, if known.
        segment_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Segment Index
        bytes_written:
          type: integer
          title: Bytes Written
          default: 0
        scheduled_start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scheduled Start Unix Ns
        actual_start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actual Start Unix Ns
        late_start_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Late Start Ms
      type: object
      required:
      - name
      - status
      - reason
      - segment_index
      - bytes_written
      - scheduled_start_unix_ns
      - actual_start_unix_ns
      - late_start_ms
      title: Participant
      description: Status of one source within the active log (spec §6.3).
    Recording:
      properties:
        state:
          type: string
          enum:
          - idle
          - armed
          - recording
          - stopping
          title: State
          default: idle
        log_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Log Id
        origin:
          anyOf:
          - type: string
            enum:
            - log-master
            - standalone
          - type: 'null'
          title: Origin
        scheduled_start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scheduled Start Unix Ns
          description: Start time of the current segment request.
        actual_start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actual Start Unix Ns
          description: Host arrival time of the first unit written in the current segment.
        scheduled_stop_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scheduled Stop Unix Ns
        segment_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Segment Index
        bytes_written:
          type: integer
          title: Bytes Written
          description: Bytes written in the current segment.
          default: 0
      type: object
      required:
      - state
      - log_id
      - origin
      - scheduled_start_unix_ns
      - actual_start_unix_ns
      - scheduled_stop_unix_ns
      - segment_index
      - bytes_written
      title: Recording
      description: Recording state of a server. When `state` is `idle`, all other fields are null / 0.
    Segment:
      properties:
        index:
          type: integer
          title: Index
        start_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Unix Ns
          description: Arrival time of the first written unit.
        end_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Unix Ns
        ended_cleanly:
          type: boolean
          title: Ended Cleanly
          default: false
        files:
          items:
            type: string
          type: array
          title: Files
      type: object
      required:
      - index
      - start_unix_ns
      - end_unix_ns
      - ended_cleanly
      - files
      title: Segment
      description: A contiguous recording period of one source within one log.
    SourceConfig:
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          title: Name
          description: Unique; used in zip paths.
        url:
          type: string
          pattern: ^https?://[^/\s]+(/\S*)?$
          title: Url
          description: Base URL of the logging server.
        enabled_by_default:
          type: boolean
          title: Enabled By Default
          default: true
      additionalProperties: false
      type: object
      required:
      - name
      - url
      title: SourceConfig
      description: A configured logging server.
    SourceList:
      properties:
        sources:
          items:
            $ref: '#/components/schemas/SourceSummary'
          type: array
          title: Sources
      type: object
      required:
      - sources
      title: SourceList
      description: Response of `GET /api/v1/sources`.
    SourceSummary:
      properties:
        name:
          type: string
          title: Name
        url:
          type: string
          title: Url
        enabled_by_default:
          type: boolean
          title: Enabled By Default
        online:
          type: boolean
          title: Online
        last_seen_unix_ns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen Unix Ns
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Last polling error, if any.
        info:
          anyOf:
          - $ref: '#/components/schemas/Info'
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
          description: Last status received (kept while offline).
        low_disk:
          type: boolean
          title: Low Disk
          default: false
        name_mismatch:
          type: boolean
          title: Name Mismatch
          default: false
        stop_pending:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Pending
          description: Log ID whose stop is not yet confirmed.
        log_status:
          anyOf:
          - type: string
            enum:
            - recording
            - armed
            - not_joined
            - busy
            - stop_pending
            - lost
          - type: 'null'
          title: Log Status
          description: Status within the active log, or `stop_pending`.
      type: object
      required:
      - name
      - url
      - enabled_by_default
      - online
      - last_seen_unix_ns
      - error
      - info
      - status
      - low_disk
      - name_mismatch
      - stop_pending
      - log_status
      title: SourceSummary
      description: A configured source with its live state.
    SourceUpdate:
      properties:
        name:
          anyOf:
          - type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          - type: 'null'
          title: Name
        url:
          anyOf:
          - type: string
            pattern: ^https?://[^/\s]+(/\S*)?$
          - type: 'null'
          title: Url
        enabled_by_default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled By Default
      additionalProperties: false
      type: object
      title: SourceUpdate
      description: Partial update of a source (`PUT /api/v1/sources/{name}`).
    StartErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - $ref: '#/components/schemas/ConflictDetails'
          - additionalProperties: true
            type: object
          title: Details
      type: object
      required:
      - code
      - message
      - details
      title: StartErrorBody
      description: Error body of `POST /api/v1/recording/start` (`conflicts` or `already_recording`).
    StartErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/StartErrorBody'
      type: object
      required:
      - error
      title: StartErrorEnvelope
      description: Error envelope of `POST /api/v1/recording/start`.
    StartRecordingRequest:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Request Id
          description: Client-generated; repeats return the original response.
        sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sources
          description: Defaults to all sources with `enabled_by_default`.
        duration_s:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Duration S
        takeover:
          items:
            type: string
          type: array
          title: Takeover
          description: Busy sources to stop and include.
        skip_busy:
          type: boolean
          title: Skip Busy
          description: Leave out busy sources not listed in `takeover`.
          default: false
      additionalProperties: false
      type: object
      required:
      - request_id
      title: StartRecordingRequest
      description: Body of `POST /api/v1/recording/start`.
    StartRecordingResponse:
      properties:
        active_log:
          $ref: '#/components/schemas/ActiveLogView'
        warnings:
          items:
            $ref: '#/components/schemas/WarningItem'
          type: array
          title: Warnings
      type: object
      required:
      - active_log
      - warnings
      title: StartRecordingResponse
      description: Response of `POST /api/v1/recording/start`.
    StateSnapshot:
      properties:
        server_time_unix_ns:
          type: integer
          title: Server Time Unix Ns
        state:
          type: string
          enum:
          - idle
          - recording
          title: State
        active_log:
          anyOf:
          - $ref: '#/components/schemas/ActiveLogView'
          - type: 'null'
        sources:
          items:
            $ref: '#/components/schemas/SourceSummary'
          type: array
          title: Sources
        stop_pending:
          additionalProperties:
            type: string
          type: object
          title: Stop Pending
        warnings:
          items:
            $ref: '#/components/schemas/WarningItem'
          type: array
          title: Warnings
      type: object
      required:
      - server_time_unix_ns
      - state
      - active_log
      - sources
      - stop_pending
      - warnings
      title: StateSnapshot
      description: Aggregate snapshot polled by the UI at 1 Hz (`GET /api/v1/state`).
    Status:
      properties:
        health:
          $ref: '#/components/schemas/Health'
        recording:
          $ref: '#/components/schemas/Recording'
        disk:
          $ref: '#/components/schemas/Disk'
        details:
          items:
            $ref: '#/components/schemas/Detail'
          type: array
          title: Details
      type: object
      required:
      - health
      - recording
      - disk
      - details
      title: Status
      description: Cheap status snapshot (`GET /v1/status`), polled by log-master at about 1 Hz.
    StopRecordingResponse:
      properties:
        log_id:
          type: string
          title: Log Id
        stop_at_unix_ns:
          type: integer
          title: Stop At Unix Ns
        stop_pending:
          items:
            type: string
          type: array
          title: Stop Pending
          description: Sources that did not confirm the stop.
      type: object
      required:
      - log_id
      - stop_at_unix_ns
      - stop_pending
      title: StopRecordingResponse
      description: Response of `POST /api/v1/recording/stop`.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarningItem:
      properties:
        code:
          type: string
          title: Code
          description: e.g. `not_joined`, `lost`, `late_start`, `health_error`, `low_disk`, `stop_pending`.
        level:
          type: string
          enum:
          - warn
          - error
          title: Level
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - level
      - source
      - message
      title: WarningItem
      description: An active warning shown in the dashboard's warnings panel.
