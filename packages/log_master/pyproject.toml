[project]
name = "log-master"
version = "0.1.0"
description = "Coordinates synchronized recording across logging servers and serves logs over HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "logserver",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "zipstream-ng>=1.7",
    "jsonschema>=4.22",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
log-master = "log_master.cli.main:main"

[tool.uv.sources]
logserver = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log_master"]
artifacts = ["src/log_master/static/**"]
