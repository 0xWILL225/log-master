[project]
name = "logserver"
version = "0.1.0"
description = "Reference implementation of the log-master Logging Server API, plus logserver-fake."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.11",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.22",
]

[project.scripts]
logserver-fake = "logserver.fake.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logserver"]
