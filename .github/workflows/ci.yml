name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          cd frontend && npm ci
      - name: Lint
        run: make lint
      - name: Spec drift
        run: make check-spec
      - name: Python tests
        run: make test
      - name: Build
        run: make build
      - name: Playwright smoke tests
        run: |
          cd frontend && npx playwright install --with-deps chromium
          make test-e2e
